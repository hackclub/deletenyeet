services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deletenyeet
      POSTGRES_PASSWORD: deletenyeet
      POSTGRES_DB: deletenyeet
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deletenyeet -d deletenyeet']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
